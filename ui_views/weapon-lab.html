<!DOCTYPE html>
<!-- This is page to be shown in Quadcode.ai ide workspace - SKILL COMPLIANCE REQUIRED
Any edits must follow skill with alias dev_create_meta_ui_to_work_with_project_data_using_html_js -->
<html lang="en"><head><style id="__qc-fouc-guard">body{visibility:hidden!important}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weapon Lab</title><style>
body{background:var(--qc-color-bg-primary);color:var(--qc-color-text-primary);font-family:var(--qc-var-font-primary);padding:12px}.shell{display:grid;grid-template-columns:230px minmax(300px,1fr) 280px;gap:12px;min-height:calc(100vh - 24px)}.list{display:grid;gap:4px}.weapon{width:100%;text-align:left}.weapon.--checked{font-weight:700}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.stack{display:grid;gap:8px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slot{min-height:70px}.bars{display:grid;gap:10px}.toolbar{display:flex;gap:6px;align-items:center}.grow{flex:1}.statusline{min-height:20px}@media(max-width:860px){.shell{grid-template-columns:1fr}.slots{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell">
<section class="panel-section p-12"><div class="toolbar"><h2 class="title grow">WEAPONS</h2><button id="openWeapons" class="button-icon" title="Open weapons JSON"><span class="icon" style="--icon:url('/_ide/images/icons/phosphor/folder-open.png')"></span></button></div><div id="weaponList" class="list"></div></section>
<section class="panel-container p-12 stack"><div><div class="comment">LIVE PROJECT DATA</div><h1 id="name" class="title">Weapon Lab</h1><div id="description" class="comment"></div></div><div id="slots" class="slots"></div><div class="bars"><div><div class="row"><span>Damage output</span><b id="damage"></b></div><div class="progress progress--danger"><div id="damageBar" class="progress__fill"></div></div></div><div><div class="row"><span>Noise radius</span><b id="noise"></b></div><div class="progress progress--accent"><div id="noiseBar" class="progress__fill"></div></div></div><div><div class="row"><span>Heat limit</span><b id="heat"></b></div><div class="progress progress--success"><div id="heatBar" class="progress__fill"></div></div></div></div><div class="toolbar"><button id="openComponent" class="button-small">OPEN COMPONENTS JSON</button><button id="runGame" class="button-large">RUN FIRST NIGHT</button></div><div id="status" class="comment statusline">Watching project data…</div></section>
<aside class="panel-section p-12 stack"><div><div class="comment">TEST CHAMBER</div><h2 class="title">FAILURE REPORT</h2></div><div id="report" class="panel-container p-12"></div><button id="test" class="button-large-critical">TEST UNTIL FAILURE</button><button id="ask" class="button-small">ASK AGENT TO BALANCE</button><div id="agent-slot"></div></aside>
</div><script>
let components=[],weapons=[],selected='';const byId=id=>components.find(x=>x.id===id);const pct=(v,max)=>Math.min(100,Math.max(4,v/max*100))+'%';
async function load(){const stamp='?t='+Date.now();[components,weapons]=await Promise.all([fetch('/data/components/components.json'+stamp).then(r=>r.json()).then(x=>x.components),fetch('/data/weapons/weapons.json'+stamp).then(r=>r.json()).then(x=>x.weapons)]);selected=weapons.some(x=>x.id===selected)?selected:weapons[0].id;render()}
function stats(w){const s={...w.base,heat_limit:60,failure_rate:.08,failure:'jam'};Object.values(w.components).forEach(id=>{const c=byId(id);Object.entries(c?.modifiers||{}).forEach(([k,v])=>{if(k==='range')s.range+=v*10;else if(k!=='power_bonus')s[k]=(s[k]||0)+v});if(c?.failure)s.failure=c.failure});return s}
function render(){weaponList.innerHTML=weapons.map(w=>`<button class="button-small weapon ${w.id===selected?'--checked':''}" data-id="${w.id}">${w.display_name}<br><span class="comment">${w.role.replaceAll('_',' ')}</span></button>`).join('');weaponList.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});const w=weapons.find(x=>x.id===selected),s=stats(w);name.textContent=w.display_name;description.textContent=w.description;slots.innerHTML=Object.entries(w.components).map(([slot,id])=>{const c=byId(id);return `<div class="panel-section p-12 slot"><div class="comment">${slot.toUpperCase()}</div><b>${c?.display_name||id}</b><div class="comment">${(c?.tags||[]).join(' · ')}</div></div>`}).join('');damage.textContent=`${s.damage} × ${s.projectiles}`;noise.textContent=s.noise;heat.textContent=s.heat_limit;damageBar.style.width=pct(s.damage*s.projectiles,220);noiseBar.style.width=pct(s.noise,360);heatBar.style.width=pct(s.heat_limit,140);report.textContent=`Safe burst: ${Math.ceil(s.heat_limit/s.heat_per_shot)} shots\nFailure: ${s.failure.toUpperCase()}\nRate: ${Math.round(s.failure_rate*100)}%\nRole: ${w.role.replaceAll('_',' ')}`}
async function init(){if(window.QC||await new Promise(r=>{let d=Date.now()+2000,t=setInterval(()=>{(window.QC||Date.now()>d)&&(clearInterval(t),r(window.QC))},20)})){await QC.ready();await QC.style.applyMainCss();await QC.fs.watchFile('data/weapons/weapons.json',load);await QC.fs.watchFile('data/components/components.json',load)}document.getElementById('__qc-fouc-guard')?.remove();await load()}
openWeapons.onclick=()=>QC?.ui.openFile('data/weapons/weapons.json');openComponent.onclick=()=>QC?.ui.openFile('data/components/components.json');runGame.onclick=()=>QC?.ui.openBrowser('http://localhost:8000');test.onclick=()=>{render();status.textContent='Deterministic chamber report updated from current JSON.'};ask.onclick=()=>{const w=weapons.find(x=>x.id===selected);new QC.forms.AgentRequestPopup({root:document.getElementById('agent-slot'),agent_name:'Cody',prompt:`Balance weapon ${w.display_name} in data/weapons/weapons.json while preserving its identity and mandatory flaw. Compare against all weapons and components in data/components/components.json. Keep all player-facing text in English.`,}).open()};init();
</script></body></html>
